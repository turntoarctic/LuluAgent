name: Android APK Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库未提交 gradlew 包装器脚本，改为按 gradle-wrapper.properties 声明的 8.9 版本直接装配 Gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 从 Secret 解出正式签名证书，并当场校验有效性。
      # 【硬门禁】Secret 缺失或密码不匹配时直接判定失败，绝不静默产出 unsigned 包
      - name: Decode & Validate Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::签名 Secret 未配置（KEYSTORE_BASE64 / KEYSTORE_PASSWORD），拒绝产出未签名包"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > lulu-release.keystore
          if ! keytool -list -keystore lulu-release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore 解码失败或密码不匹配，请检查 KEYSTORE_BASE64 与 KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "✅ Keystore 校验通过，可用于正式签名"

      - name: Build Debug & Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Secret 未单独配置 KEY_ALIAS 时回退到默认别名 lulu
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lulu' }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      # 【核心门禁】Release 包必须是正式签名：unsigned 文件名直接判败 + apksigner 校验证书指纹
      - name: Verify Release Signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "校验对象: $APK"
          if [[ "$APK" == *unsigned* ]]; then
            echo "::error::Release APK 为未签名包，签名配置未生效！"
            exit 1
          fi
          BT=$(ls -d "${ANDROID_HOME}/build-tools/"*/ | sort | tail -n 1)
          "$BT/apksigner" verify --print-certs "$APK"
          echo "✅ 正式签名校验通过"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jobmate-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  # 构建+签名校验通过后，自动创建 GitHub Release 并附上带版本号的签名 APK
  # 幂等保护：tag 已存在（同版本号重复推送）时跳过，不报错
  release:
    name: Auto Create Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version Name
        id: ver
        run: echo "version=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          name: Jobmate-apks
          path: apks

      - name: Create Release with Signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} 已存在，跳过创建（同版本号重复推送）"
            exit 0
          fi
          mkdir -p dist
          cp "apks/release/"*.apk "dist/Jobmate-v${VERSION}-release-signed.apk"
          if [ -d apks/debug ] && ls "apks/debug/"*.apk >/dev/null 2>&1; then
            cp "apks/debug/"*.apk "dist/Jobmate-v${VERSION}-debug.apk"
          fi
          ls -l dist/
          gh release create "$TAG" dist/*.apk \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "求职搭子 v${VERSION}" \
            --generate-notes
          echo "✅ Release ${TAG} 已自动发布"
